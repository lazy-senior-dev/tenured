# .github/workflows/grumpy.yml
name: tenured

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: grumpy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: lazy-senior-dev/tenured@v1
        with:
          mode: nag            # or gate: request changes and fail the check until NEW
          # provider: openai   # then set OPENAI_API_KEY below instead
          # provider: bob      # IBM Bob: set BOB_API_KEY below instead; the Bob CLI is installed on the runner
          # model: claude-opus-5
          # max_files: 25
          # ignore: |
          #   docs/**
          #   **/*.generated.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
