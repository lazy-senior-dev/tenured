name: release

on:
  push:
    tags: ["v*.*.*"] # the moving major tag (v1) is not a release

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm run check
      - name: Pack adapters
        run: |
          mkdir -p dist
          zip -qr "dist/tenured-adapters-${GITHUB_REF_NAME}.zip" \
            rules AGENTS.md GEMINI.md gemini-extension.json commands skills hooks \
            .claude-plugin .codex-plugin .agents .github/plugin .github/copilot-instructions.md \
            .devin-plugin .qoder-plugin .qoder .opencode .cursor .windsurf .clinerules .kiro .openclaw mcp examples \
            LICENSE NOTICE README.md
      - name: Software bill of materials
        run: npm sbom --sbom-format cyclonedx --sbom-type application > "dist/${GITHUB_REF_NAME}-sbom.cdx.json"
      - name: Build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v4.2.2
        with:
          subject-path: dist/*

      - name: GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.zip
            dist/*-sbom.cdx.json
          generate_release_notes: true
          body: |
            Install: see the README. Adapters for every supported host are attached as a zip for hosts that want a copy rather than a clone. The zip and the CycloneDX bill of materials carry GitHub build provenance: verify with `gh attestation verify <file> --repo lazy-senior-dev/tenured`.
      - name: Publish to npm
        # OIDC trusted publishing: npm verifies this workflow against the package's configured
        # publisher, so no long-lived token is stored here. It has to be configured once at
        # npmjs.com under the package's Settings, Trusted publisher. Until that is done the
        # publish cannot authenticate, which must not fail a release whose other artifacts are
        # fine, so the step reports what to do and carries on.
        continue-on-error: true
        id: npm
        run: npm publish --provenance --access public
      - name: Say what to do when the npm publish did not run
        if: steps.npm.outcome == 'failure'
        run: |
          echo "::warning title=npm publish skipped::Configure the trusted publisher for this package at npmjs.com (Settings, Trusted publisher: this repository, workflow release.yml), then re-run this job. Everything else in this release published normally."
