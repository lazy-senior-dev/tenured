name: benchmark

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Runs per diff"
        default: "3"
      model:
        description: "Model id for the Messages API"
        default: "claude-sonnet-5"

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Run against the Messages API
        run: node benchmarks/run.mjs --agents api --n "${{ inputs.n }}" --model.api "${{ inputs.model }}" --concurrency 3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: node benchmarks/report.mjs && node scripts/render-chart.mjs && node scripts/sync-site.mjs && node scripts/update-readme.mjs
      - name: Open a pull request with the results
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: bench/results-${{ github.run_id }}
          title: "bench: results from ${{ inputs.model }} (${{ inputs.n }} runs)"
          commit-message: "bench: results from ${{ inputs.model }}"
          body: "Automated benchmark run. Review the report under benchmarks/results before merging."
