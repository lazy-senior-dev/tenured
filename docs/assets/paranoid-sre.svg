<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="t d">
  <title id="t">The Paranoid SRE</title>
  <desc id="d">Line sketch of an on-call engineer with her hair in a bun, a headset, wide alert eyes, and a pager clipped to her collar.</desc>
  <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- shoulders and collar -->
    <path d="M 22 318 C 40 262, 92 250, 118 226"/>
    <path d="M 298 318 C 280 262, 228 250, 202 226"/>
    <path d="M 118 226 C 130 244, 150 250, 160 250 C 170 250, 190 244, 202 226"/>
    <!-- rolled sleeve seam hints -->
    <path d="M 44 296 L 70 304" stroke-width="2"/>
    <path d="M 276 296 L 250 304" stroke-width="2"/>
    <!-- head -->
    <path d="M 108 100 C 108 52, 212 52, 212 100 L 214 166 C 214 210, 106 210, 106 166 Z"/>
    <!-- hair: pulled back, bun on top -->
    <path d="M 108 100 C 112 70, 140 58, 160 58 C 180 58, 208 70, 212 100" stroke-width="3.5"/>
    <path d="M 120 92 C 130 78, 145 72, 160 72" stroke-width="2"/>
    <path d="M 200 92 C 190 78, 175 72, 160 72" stroke-width="2"/>
    <circle cx="160" cy="46" r="16"/>
    <path d="M 150 40 C 156 34, 166 34, 170 40" stroke-width="2"/>
    <!-- ears -->
    <path d="M 107 128 C 92 124, 90 152, 106 158"/>
    <path d="M 213 128 C 228 124, 230 152, 214 158"/>
    <!-- headset band and earpiece with mic -->
    <path d="M 104 118 C 96 84, 224 84, 216 118" stroke-width="3.5"/>
    <rect x="86" y="126" width="18" height="28" rx="6"/>
    <path d="M 95 154 C 92 176, 112 190, 134 192" stroke-width="2.5"/>
    <circle cx="138" cy="192" r="4"/>
    <!-- brows: raised, alert -->
    <path d="M 122 104 C 132 96, 146 98, 152 104" stroke-width="4.5"/>
    <path d="M 198 104 C 188 96, 174 98, 168 104" stroke-width="4.5"/>
    <!-- wide eyes (open / closed for the blink) -->
    <g class="eye-open">
      <circle cx="137" cy="126" r="10"/>
      <circle cx="183" cy="126" r="10"/>
      <circle cx="137" cy="127" r="3.5" fill="currentColor" stroke="none"/>
      <circle cx="183" cy="127" r="3.5" fill="currentColor" stroke="none"/>
    </g>
    <g class="eye-closed">
      <path d="M 127 127 L 147 127"/>
      <path d="M 173 127 L 193 127"/>
    </g>
    <!-- tired lines under the eyes -->
    <path d="M 128 140 C 134 144, 142 144, 148 140" stroke-width="1.5"/>
    <path d="M 172 140 C 178 144, 186 144, 192 140" stroke-width="1.5"/>
    <!-- nose -->
    <path d="M 161 130 L 156 158 C 158 162, 164 162, 166 158"/>
    <!-- mouth: small, tight -->
    <path d="M 148 182 L 172 182" stroke-width="3.5"/>
    <!-- pager clipped at the collar -->
    <rect x="196" y="238" width="44" height="26" rx="4"/>
    <rect x="202" y="244" width="24" height="12" rx="2" stroke-width="2"/>
    <rect class="led" x="234" y="243" width="4" height="4" rx="1" fill="currentColor" stroke="none"/>
    <path d="M 232 244 L 232 256" stroke-width="2"/>
    <path d="M 240 246 L 246 240" stroke-width="2"/>
    <!-- lanyard -->
    <path d="M 150 250 L 200 262" stroke-width="2"/>
  </g>
</svg>
